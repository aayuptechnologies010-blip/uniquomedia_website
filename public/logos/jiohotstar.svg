<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="100%" height="100%">
  <!-- Jio Pill Emblem -->
  <g transform="translate(10, 14)">
    <rect x="0" y="4" width="56" height="34" rx="17" fill="#E21836" />
    <text x="28" y="27" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-style="italic">Jio</text>
  </g>
  <!-- Hotstar Star Emblem -->
  <g transform="translate(76, 12)">
    <defs>
      <linearGradient id="hotstarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00E5A3" />
        <stop offset="100%" stop-color="#00A884" />
      </linearGradient>
    </defs>
    <!-- Dynamic curved star -->
    <path d="M22 2 L26 15 L39 19 L26 23 L22 36 L18 23 L5 19 L18 15 Z" fill="url(#hotstarGrad)" />
    <circle cx="22" cy="19" r="4" fill="#FFFFFF" opacity="0.9" />
  </g>
  <!-- Hotstar Bold Typography -->
  <text x="124" y="42" font-family="'Inter', 'Montserrat', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    hot<tspan fill="#00E5A3">star</tspan>
  </text>
  <text x="126" y="56" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#FFD67A" opacity="0.9">ENTERTAINMENT &amp; LIVE</text>
</svg>
